<!-- Cabeçalho Gov.BR -->
<header class="br-header">
  <div class="container-lg">
    <div class="header-top">
      <div class="header-logo">
        <!-- Caminho da logo alterado conforme solicitado -->
        <img src="assets/img/cae_ufj.png" alt="Logo CAE UFJ" />
      </div>
      <div class="header-actions">
        <div class="header-links dropdown">
          <div class="br-list">
            <div class="header">
              <div class="title">Acesso Rápido</div>
            </div>
            <a class="br-item" href="https://ouvidoria.ufj.edu.br/?_gl=1%2A1ncepl5%2A_ga%2AMTQ4NDg2NTc5Mi4xNzQ5ODIxOTIz%2A_ga_4SREW4GL2K%2AczE3OTAxMzM1NjAkbzIxJGcxJHQxNzkwMTM0MDczJGo2MCRsMCRoMA..">Ouvidoria</a>
            <a class="br-item" href="https://ufj.edu.br/sic/">Acesso à Informação</a>
            <a class="br-item" href="https://ufj.edu.br/servicos/">Serviços</a>
          </div>
        </div>
        <span class="br-divider vertical mx-half mx-sm-1"></span>
        <div class="header-functions dropdown">
          <button
            class="br-button circle small"
            type="button"
            data-toggle="dropdown"
            aria-label="Abrir Funcionalidades do Sistema"
          >
            <i class="fas fa-th" aria-hidden="true"></i>
          </button>
          <div class="br-list">
            <div class="header">
              <div class="title">Funcionalidades do Sistema</div>
            </div>
            <div class="br-item">
              <button
                class="br-button circle small"
                type="button"
                aria-label="Funcionalidade 1"
              >
                <i class="fas fa-chart-bar" aria-hidden="true"></i
                ><span class="text">Funcionalidade 1</span>
              </button>
            </div>
            <div class="br-item">
              <button
                class="br-button circle small"
                type="button"
                aria-label="Funcionalidade 2"
              >
                <i class="fas fa-headset" aria-hidden="true"></i
                ><span class="text">Funcionalidade 2</span>
              </button>
            </div>
            <div class="br-item">
              <button
                class="br-button circle small"
                type="button"
                aria-label="Funcionalidade 3"
              >
                <i class="fas fa-comment" aria-hidden="true"></i
                ><span class="text">Funcionalidade 3</span>
              </button>
            </div>
            <div class="br-item">
              <button
                class="br-button circle small"
                type="button"
                aria-label="Funcionalidade 4"
              >
                <i class="fas fa-adjust" aria-hidden="true"></i
                ><span class="text">Funcionalidade 4</span>
              </button>
            </div>
          </div>
        </div>
        <div class="header-search-trigger">
          <button
            class="br-button circle"
            type="button"
            aria-label="Abrir Busca"
            data-toggle="search"
            data-target=".header-search"
          >
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
        </div>
      </div>
    </div>
    <div class="header-bottom">
      <div class="header-menu">
       
        <div class="header-info">
          <div class="header-title">Comitê de Acompanhamento de Egressos</div>
          <div class="header-subtitle">Universidade Federal de Jataí</div>
        </div>
      </div>
      <div class="header-search">
        <div class="br-input has-icon">
          <label for="searchbox-98739">Texto da pesquisa</label>
          <input
            id="searchbox-98739"
            type="text"
            placeholder="O que você procura?"
          />
          <button
            class="br-button circle small"
            type="button"
            aria-label="Pesquisar"
          >
            <i class="fas fa-search" aria-hidden="true"></i>
          </button>
        </div>
        <button
          class="br-button circle search-close ml-1"
          type="button"
          aria-label="Fechar Busca"
          data-dismiss="search"
        >
          <i class="fas fa-times" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>
</header>
