<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard - Painel UFJ</title>
    <link href="../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link
      href="../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link href="../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div
        class="spinner-border"
        role="status"
        style="width: 3rem; height: 3rem; color: var(--color-azul-riachuelo)"
      ></div>
      <h5 class="mt-3 fw-bold" style="color: var(--text-secondary)">
        Verificando credenciais...
      </h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4
              class="mb-0 fw-bold"
              style="color: var(--color-azul-riachuelo)"
              id="page-title"
            >
              Dashboard
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../assets/img/person/user.png"
                id="top-avatar"
                alt="Profile"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="row g-4 mb-5">
            <!-- Card Egressos -->
            <div class="col-md-4">
              <div
                class="card text-white shadow border-0 rounded-4 h-100"
                style="background-color: var(--color-azul-riachuelo)"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white mb-1" id="card-egressos-title">
                      Egressos Cadastrados
                    </h6>
                    <h2
                      class="text-white mb-0 fw-bold"
                      id="card-egressos-count"
                    >
                      <span
                        class="spinner-border spinner-border-sm"
                        role="status"
                      ></span>
                    </h2>
                  </div>
                  <i class="bi bi-people fs-1 text-white"></i>
                </div>
              </div>
            </div>

            <!-- Card Vagas -->
            <div class="col-md-4">
              <div
                class="card text-white shadow border-0 rounded-4 h-100"
                style="background-color: var(--color-laranja-flor-de-cosmos)"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white mb-1">Vagas de Emprego</h6>
                    <h2 class="text-white mb-0 fw-bold" id="card-vagas-count">
                      <span
                        class="spinner-border spinner-border-sm"
                        role="status"
                      ></span>
                    </h2>
                  </div>
                  <i class="bi bi-briefcase fs-1 text-white"></i>
                </div>
              </div>
            </div>

            <!-- Card Notícias -->
            <div class="col-md-4">
              <div
                class="card text-white shadow border-0 rounded-4 h-100"
                style="background-color: var(--color-verde-corrego)"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white mb-1">Notícias Cadastradas</h6>
                    <h2
                      class="text-white mb-0 fw-bold"
                      id="card-noticias-count"
                    >
                      <span
                        class="spinner-border spinner-border-sm"
                        role="status"
                      ></span>
                    </h2>
                  </div>
                  <i class="bi bi-newspaper fs-1 text-white"></i>
                </div>
              </div>
            </div>
          </div>

          <div
            class="card border-0 shadow-sm rounded-4 p-4 mb-4"
            style="background-color: var(--surface-color)"
          >
            <h5 class="fw-bold mb-3" style="color: var(--color-azul-riachuelo)">
              <i
                class="bi bi-info-circle me-2"
                style="color: var(--color-amarelo-abelha)"
              ></i
              >Bem-vindo ao Portal de Egressos
            </h5>
            <p class="text-muted mb-0">
              Utilize o menu lateral para gerenciar conteúdos, postar notícias,
              eventos e analisar o banco de oportunidades e vagas.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const context = await inicializarPainel("dashboard", ".");
        if (!context) return;

        const { supabase, perfil } = context;

        // Atualiza a foto do topo caso o usuário já tenha enviado
        if (perfil.foto_perfil) {
          document.getElementById("top-avatar").src = perfil.foto_perfil;
        }

        const titleEgressos = document.getElementById("card-egressos-title");
        const countEgressos = document.getElementById("card-egressos-count");
        const countVagas = document.getElementById("card-vagas-count");
        const countNoticias = document.getElementById("card-noticias-count");

        // 1. Configurar o título do Card de Egressos dependendo do nível
        if (perfil.nivel_acesso === "administrador") {
          titleEgressos.innerText = "Egressos Cadastrados (Geral)";
        } else if (perfil.nivel_acesso === "coordenacao") {
          titleEgressos.innerText = `Egressos (${perfil.curso_ufj || "Sem Curso Vinculado"})`;
        }

        try {
          // 2. Prepara a query de Egressos com o filtro adequado
          let queryEgressos = supabase
            .from("perfis")
            .select("id", { count: "exact", head: true })
            .eq("nivel_acesso", "egresso");

          if (perfil.nivel_acesso === "coordenacao" && perfil.curso_ufj) {
            queryEgressos = queryEgressos.eq("curso_ufj", perfil.curso_ufj);
          }

          // 3. Executa as três buscas simultaneamente para não travar a tela
          const [resEgressos, resVagas, resNoticias] = await Promise.all([
            queryEgressos,
            supabase.from("vagas").select("id", { count: "exact", head: true }),
            supabase
              .from("noticias")
              .select("id", { count: "exact", head: true }),
          ]);

          // 4. Injeta os resultados no HTML
          countEgressos.innerText = resEgressos.error ? "0" : resEgressos.count;
          countVagas.innerText = resVagas.error ? "0" : resVagas.count;
          countNoticias.innerText = resNoticias.error ? "0" : resNoticias.count;
        } catch (error) {
          console.error("Erro ao buscar contagens:", error);
          countEgressos.innerText = "-";
          countVagas.innerText = "-";
          countNoticias.innerText = "-";
        }
      });
    </script>
  </body>
</html>
