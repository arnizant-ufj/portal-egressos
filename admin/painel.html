<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard - Painel UFJ</title>
    <link href="../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../assets/css/main.css" rel="stylesheet" />
    <link href="../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div
        class="spinner-border text-primary"
        role="status"
        style="width: 3rem; height: 3rem"
      ></div>
      <h5 class="mt-3 text-secondary fw-bold">Verificando credenciais...</h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4 class="mb-0 text-secondary fw-bold" id="page-title">
              Dashboard
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../assets/img/person/person-m-9.webp"
                alt="Profile"
                class="rounded-circle shadow-sm"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="row g-4 mb-5">
            <div class="col-md-4">
              <div
                class="card bg-primary text-white shadow border-0 rounded-4 h-100"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white-50 mb-1">Egressos Cadastrados</h6>
                    <h2 class="mb-0 fw-bold">142</h2>
                  </div>
                  <i class="bi bi-people fs-1 text-white-50"></i>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div
                class="card text-white shadow border-0 rounded-4 h-100"
                style="background-color: #47b2e4"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white-50 mb-1">Vagas Pendentes</h6>
                    <h2 class="mb-0 fw-bold">5</h2>
                  </div>
                  <i class="bi bi-briefcase fs-1 text-white-50"></i>
                </div>
              </div>
            </div>
            <div class="col-md-4">
              <div
                class="card bg-success text-white shadow border-0 rounded-4 h-100"
              >
                <div
                  class="card-body p-4 d-flex justify-content-between align-items-center"
                >
                  <div>
                    <h6 class="text-white-50 mb-1">Notícias Publicadas</h6>
                    <h2 class="mb-0 fw-bold">12</h2>
                  </div>
                  <i class="bi bi-newspaper fs-1 text-white-50"></i>
                </div>
              </div>
            </div>
          </div>

          <div class="card border-0 shadow-sm rounded-4 p-4 mb-4">
            <h5 class="fw-bold mb-3 text-secondary">
              <i class="bi bi-info-circle text-primary me-2"></i>Bem-vindo ao
              Portal de Egressos
            </h5>
            <p class="text-muted mb-0">
              Utilize o menu lateral para gerenciar conteúdos, postar notícias,
              eventos e analisar o banco de oportunidades e vagas.
            </p>
          </div>
        </div>
      </div>
    </div>

    <script src="../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        // "dashboard" é o ID do menu que ficará azul. "." indica a raiz da pasta admin.
        const context = await inicializarPainel("dashboard", ".");
      });
    </script>
  </body>
</html>
