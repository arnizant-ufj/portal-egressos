<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Notícias - Painel UFJ</title>

    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

    <link href="../../assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet" />
    <link href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet" />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div class="spinner-border text-primary" role="status"></div>
      <h5 class="mt-3 text-secondary fw-bold">Carregando módulo...</h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none;">
      <div class="row">
        
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img src="../../assets/img/logo_ufj_branca.png" alt="Logo UFJ" class="img-fluid mb-3" style="max-height: 55px" />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"><i class="bi bi-box-arrow-left"></i> Sair</a>
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0">
            <h4 class="mb-0 text-secondary fw-bold" id="page-title">Notícias</h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name">...</span>
              <i class="bi bi-person-circle fs-2 text-primary"></i>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">Gerenciar Notícias</h5>
            <a href="form.html" class="btn btn-primary">
              <i class="bi bi-plus-lg me-2"></i>Nova Notícia
            </a>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Título</th>
                    <th>Categoria</th>
                    <th>Data</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-noticias">
                  <tr><td colspan="5" class="text-center py-4">Carregando notícias...</td></tr>
                </tbody>
              </table>
            </div>
          </div>

        </div>
      </div>
    </div>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        // Inicializa o layout avisando que estamos na página 'noticias'
        const context = await inicializarPainel('noticias', '..');
        if (!context) return; // Se não tem sessão, para aqui

        const supabase = context.supabase;
        const tbody = document.getElementById('tabela-noticias');

        // Função para buscar e listar as notícias
        async function carregarNoticias() {
          const { data: noticias, error } = await supabase
            .from('noticias')
            .select('id, titulo, categoria, created_at')
            .order('created_at', { ascending: false });

          if (error) {
            console.error("Erro ao buscar notícias:", error);
            tbody.innerHTML = '<tr><td colspan="5" class="text-danger text-center">Erro ao carregar dados.</td></tr>';
            return;
          }

          if (noticias.length === 0) {
            tbody.innerHTML = '<tr><td colspan="5" class="text-center text-secondary py-4">Nenhuma notícia cadastrada.</td></tr>';
            return;
          }

          tbody.innerHTML = ''; // Limpa a tabela

          noticias.forEach(noticia => {
            // Formata a data (de timestamp do banco para DD/MM/YYYY)
            const dataFormatada = new Date(noticia.created_at).toLocaleDateString('pt-BR');

            const tr = document.createElement('tr');
            tr.innerHTML = `
              <td class="text-secondary fw-medium">#${noticia.id}</td>
              <td class="fw-bold">${noticia.titulo}</td>
              <td><span class="badge bg-light text-dark border">${noticia.categoria}</span></td>
              <td>${dataFormatada}</td>
              <td class="text-end">
                <a href="form.html?id=${noticia.id}" class="btn btn-sm btn-outline-primary me-2" title="Editar">
                  <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger btn-excluir" data-id="${noticia.id}" title="Excluir">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });

          // Adiciona o evento de clique nos botões de excluir
          document.querySelectorAll('.btn-excluir').forEach(btn => {
            btn.addEventListener('click', async function() {
              const id = this.getAttribute('data-id');
              
              if (confirm(`Tem certeza que deseja excluir a notícia #${id}?\nEssa ação não pode ser desfeita.`)) {
                
                // Exclui do banco
                const { error: deleteError } = await supabase
                  .from('noticias')
                  .delete()
                  .eq('id', id);

                if (deleteError) {
                  alert("Erro ao excluir notícia.");
                  console.error(deleteError);
                } else {
                  alert("Notícia excluída com sucesso!");
                  carregarNoticias(); // Recarrega a tabela na tela
                }
              }
            });
          });
        }

        // Chama a função ao abrir a página
        carregarNoticias();
      });
    </script>
  </body>
</html>
