<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Eventos - Painel UFJ</title>
    <link href="../../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div class="spinner-border text-primary" role="status"></div>
      <h5 class="mt-3 text-secondary fw-bold">Carregando módulo...</h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4 class="mb-0 text-secondary fw-bold" id="page-title">Eventos</h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/user.png"
                id="top-avatar"
                alt="Profile"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">Meus Eventos</h5>
            <a href="form.html" class="btn btn-primary fw-bold shadow-sm">
              <i class="bi bi-plus-lg me-2"></i>Novo Evento
            </a>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <div class="table-responsive">
              <table class="table table-hover align-middle">
                <thead class="table-light">
                  <tr>
                    <th>ID</th>
                    <th>Título do Evento</th>
                    <th>Data(s)</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-eventos">
                  <tr>
                    <td colspan="4" class="text-center py-4">
                      Carregando eventos...
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Alerta Padrão -->
    <div class="modal fade" id="modalAlertas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header text-white" id="modal-alerta-header">
            <h5 class="modal-title fw-bold">
              <i class="bi" id="modal-alerta-icon"></i> <span id="modal-alerta-titulo">Mensagem</span>
            </h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4 text-center">
            <p class="fs-5 mb-0" id="modal-alerta-mensagem"></p>
          </div>
          <div class="modal-footer bg-light border-0 justify-content-center">
            <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">Fechar</button>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Confirmação de Exclusão -->
    <div class="modal fade" id="modalConfirmacao" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header text-white" style="background-color: var(--background);">
            <h5 class="modal-title fw-bold"><i class="bi bi-exclamation-triangle-fill me-2"></i>Confirmação</h5>
            <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body p-4 text-center">
            <p class="fs-5 mb-0">Tem certeza que deseja excluir este evento? Esta ação não pode ser desfeita.</p>
          </div>
          <div class="modal-footer bg-light border-0 justify-content-center">
            <button type="button" class="btn btn-secondary px-4 fw-bold" data-bs-dismiss="modal">Cancelar</button>
            <button type="button" class="btn btn-danger px-4 fw-bold" id="btn-confirmar-exclusao">Excluir</button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const context = await inicializarPainel("eventos", "..");
        if (!context) return;

        const supabase = context.supabase;
        const perfil = context.perfil;
        const userId = context.session.user.id;
        const tbody = document.getElementById("tabela-eventos");

        if (perfil.foto_perfil) {
          document.getElementById("top-avatar").src = perfil.foto_perfil;
        }

        // Configuração dos Modais
        let modalAlertas = new bootstrap.Modal(document.getElementById("modalAlertas"));
        let modalConfirmacao = new bootstrap.Modal(document.getElementById("modalConfirmacao"));
        let eventoIdParaExcluir = null;

        function exibirAlerta(titulo, mensagem, tipo) {
          const header = document.getElementById("modal-alerta-header");
          const icon = document.getElementById("modal-alerta-icon");
          
          document.getElementById("modal-alerta-titulo").innerText = titulo;
          document.getElementById("modal-alerta-mensagem").innerText = mensagem;
          
          header.className = "modal-header text-white";
          icon.className = "bi me-2";

          if (tipo === "sucesso") {
              header.style.backgroundColor = "var(--background)";
              icon.classList.add("bi-check-circle-fill");
          } else if (tipo === "erro") {
              header.style.backgroundColor = "#dc3545"; 
              icon.classList.add("bi-exclamation-triangle-fill");
          } else {
              header.style.backgroundColor = "var(--color-azul-riachuelo)";
              icon.classList.add("bi-info-circle-fill");
          }
          
          modalAlertas.show();
        }

        function formatarData(dataISO) {
          const partes = dataISO.split("-");
          return `${partes[2]}/${partes[1]}/${partes[0]}`;
        }

        async function carregarEventos() {
          const { data: eventos, error } = await supabase
            .from("eventos")
            .select("id, titulo, data_inicio, data_fim")
            .eq("usuario_id", userId)
            .order("data_inicio", { ascending: false });

          if (error) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-danger text-center py-4">Erro ao carregar dados.</td></tr>';
            return;
          }

          if (eventos.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center text-secondary py-4">Nenhum evento cadastrado.</td></tr>';
            return;
          }

          tbody.innerHTML = "";

          eventos.forEach((evento) => {
            let dataExibicao = formatarData(evento.data_inicio);
            if (evento.data_fim) {
              dataExibicao += ` até ${formatarData(evento.data_fim)}`;
            }

            const tr = document.createElement("tr");
            tr.innerHTML = `
              <td class="text-secondary fw-medium">#${evento.id}</td>
              <td class="fw-bold" style="color: var(--color-azul-riachuelo);">${evento.titulo}</td>
              <td><i class="bi bi-calendar-event me-2 text-secondary"></i>${dataExibicao}</td>
              <td class="text-end">
                <a href="form.html?id=${evento.id}" class="btn btn-sm btn-outline-primary me-2" style="border-color: var(--color-azul-riachuelo); color: var(--color-azul-riachuelo);" title="Editar">
                  <i class="bi bi-pencil"></i>
                </a>
                <button class="btn btn-sm btn-outline-danger btn-excluir" data-id="${evento.id}" title="Excluir">
                  <i class="bi bi-trash"></i>
                </button>
              </td>
            `;
            tbody.appendChild(tr);
          });

          // Lógica de abertura do Modal de Exclusão
          document.querySelectorAll(".btn-excluir").forEach((btn) => {
            btn.addEventListener("click", function () {
              eventoIdParaExcluir = this.getAttribute("data-id");
              modalConfirmacao.show();
            });
          });
        }

        // Confirmação de Exclusão
        document.getElementById("btn-confirmar-exclusao").addEventListener("click", async function() {
            if (!eventoIdParaExcluir) return;

            const btnOriginal = this.innerText;
            this.innerText = "Excluindo...";
            this.disabled = true;

            const { error: deleteError } = await supabase
              .from("eventos")
              .delete()
              .eq("id", eventoIdParaExcluir);

            this.innerText = btnOriginal;
            this.disabled = false;
            modalConfirmacao.hide();

            if (deleteError) {
              console.error(deleteError);
              exibirAlerta("Erro", "Erro ao excluir o evento.", "erro");
            } else {
              exibirAlerta("Sucesso", "O evento foi excluído com sucesso!", "sucesso");
              carregarEventos(); // Recarrega a tabela imediatamente
            }
        });

        carregarEventos();
      });
    </script>
  </body>
</html>
