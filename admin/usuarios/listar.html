<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Usuários - Painel UFJ</title>
    <link href="../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div class="spinner-border text-primary" role="status"></div>
      <h5 class="mt-3 text-secondary fw-bold">Carregando usuários...</h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4 class="mb-0 text-secondary fw-bold" id="page-title">
              Usuários
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/person-m-9.webp"
                id="top-avatar"
                alt="Profile"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div
            class="d-flex flex-column flex-md-row justify-content-between align-items-md-center mb-4 gap-3"
          >
            <h5 class="fw-bold mb-0">Gerenciar Contas do Sistema</h5>

            <div class="d-flex gap-3 align-items-center">
              <div class="input-group shadow-sm" style="max-width: 300px">
                <span class="input-group-text bg-white border-end-0 text-muted">
                  <i class="bi bi-search"></i>
                </span>
                <input
                  type="text"
                  id="input-busca"
                  class="form-control border-start-0 ps-0"
                  placeholder="Buscar por nome..."
                />
              </div>

              <a href="form.html" class="btn btn-primary text-nowrap shadow-sm">
                <i class="bi bi-person-plus-fill me-2"></i>Novo Usuário
              </a>
            </div>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <div class="table-responsive">
              <table
                class="table table-hover align-middle"
                id="tabela-principal"
              >
                <thead class="table-light">
                  <tr>
                    <th>Nome</th>
                    <th>E-mail</th>
                    <th>Nível de Acesso</th>
                    <th>Curso (Coordenação)</th>
                    <th class="text-end">Ações</th>
                  </tr>
                </thead>
                <tbody id="tabela-usuarios">
                  <tr>
                    <td colspan="5" class="text-center py-4">Carregando...</td>
                  </tr>
                </tbody>
              </table>
              <div
                id="mensagem-vazia"
                class="text-center text-muted py-4 d-none"
              >
                Nenhum usuário encontrado com esse nome.
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const context = await inicializarPainel("usuarios", "..");
        if (!context) return;

        const supabase = context.supabase;
        const perfil = context.perfil;

        // Bloqueio extra: Se não for admin, chuta pra fora
        if (perfil.nivel_acesso !== "administrador") {
          alert(
            "Acesso negado. Apenas administradores podem acessar esta área.",
          );
          window.location.href = "../painel.html";
          return;
        }

        if (perfil.foto_perfil) {
          document.getElementById("top-avatar").src = perfil.foto_perfil;
        }

        // Tabela de pesos para forçar a ordenação personalizada
        const pesosOrdenacao = {
          administrador: 1,
          coordenacao: 2,
          egresso: 3,
        };

        async function carregarUsuarios() {
          const tbody = document.getElementById("tabela-usuarios");

          const { data: usuarios, error } = await supabase
            .from("perfis")
            .select("*");

          if (error) {
            tbody.innerHTML =
              '<tr><td colspan="5" class="text-danger text-center">Erro ao carregar dados.</td></tr>';
            return;
          }

          // Ordenação Customizada: Primeiro por Peso (Nível de Acesso), depois Alfabético (Nome)
          usuarios.sort((a, b) => {
            const pesoA = pesosOrdenacao[a.nivel_acesso] || 99;
            const pesoB = pesosOrdenacao[b.nivel_acesso] || 99;

            if (pesoA < pesoB) return -1;
            if (pesoA > pesoB) return 1;

            // Se os pesos forem iguais, desempata pela ordem alfabética do nome
            return a.nome.localeCompare(b.nome);
          });

          tbody.innerHTML = "";

          usuarios.forEach((user) => {
            let badgeClass = "bg-secondary";
            let acessoTexto = "Egresso";

            if (user.nivel_acesso === "administrador") {
              badgeClass = "bg-danger";
              acessoTexto = "Administrador";
            } else if (user.nivel_acesso === "coordenacao") {
              badgeClass = "bg-primary";
              acessoTexto = "Coordenação";
            }

            const cursoExibicao = user.curso
              ? user.curso
              : '<span class="text-muted">-</span>';

            const tr = document.createElement("tr");
            tr.className = "usuario-row"; // Classe usada para a pesquisa funcionar
            tr.innerHTML = `
              <td class="fw-bold text-dark d-flex align-items-center nome-usuario">
                <img src="${user.foto_perfil || "../../assets/img/person/person-m-9.webp"}" class="rounded-circle me-3" style="width: 35px; height: 35px; object-fit: cover;">
                ${user.nome}
              </td>
              <td>${user.email}</td>
              <td><span class="badge ${badgeClass}">${acessoTexto}</span></td>
              <td>${cursoExibicao}</td>
              <td class="text-end">
                <a href="form.html?id=${user.id}" class="btn btn-sm btn-outline-primary" title="Editar">
                  <i class="bi bi-pencil"></i>
                </a>
              </td>
            `;
            tbody.appendChild(tr);
          });
        }

        await carregarUsuarios();

        // Sistema de Pesquisa em Tempo Real
        const inputBusca = document.getElementById("input-busca");
        const mensagemVazia = document.getElementById("mensagem-vazia");

        inputBusca.addEventListener("input", function () {
          const termo = this.value.toLowerCase();
          const linhas = document.querySelectorAll(".usuario-row");
          let encontrouAlguem = false;

          linhas.forEach((linha) => {
            const nome = linha
              .querySelector(".nome-usuario")
              .textContent.toLowerCase();

            if (nome.includes(termo)) {
              linha.style.display = "";
              encontrouAlguem = true;
            } else {
              linha.style.display = "none";
            }
          });

          // Mostra a mensagem de lista vazia caso a pesquisa não retorne ninguém
          if (!encontrouAlguem && linhas.length > 0) {
            mensagemVazia.classList.remove("d-none");
          } else {
            mensagemVazia.classList.add("d-none");
          }
        });
      });
    </script>
  </body>
</html>
