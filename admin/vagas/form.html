<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gerenciar Oportunidade - Painel UFJ</title>
    <link href="../../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />

    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>

  <body>
    <div id="loading-screen">
      <div
        class="spinner-border"
        style="color: var(--color-azul-riachuelo)"
        role="status"
      ></div>
      <h5 class="mt-3 text-secondary fw-bold">Preparando formulário...</h5>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4
              class="mb-0 fw-bold"
              style="color: var(--color-azul-riachuelo)"
              id="page-title"
            >
              Oportunidades
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/user.png"
                id="top-avatar"
                alt="Profile"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="mb-3">
            <a
              href="listar.html"
              class="btn btn-outline-secondary btn-sm fw-bold"
            >
              <i class="bi bi-arrow-left me-1"></i> Voltar para a Lista
            </a>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <h5
              class="fw-bold mb-4 border-bottom pb-2"
              style="color: var(--color-azul-riachuelo)"
              id="titulo-form"
            >
              Cadastrar Nova Vaga
            </h5>

            <div
              id="feedback-reprovacao"
              class="alert text-white mb-4 shadow-sm"
              style="display: none; background-color: #dc3545"
            >
              <h6 class="fw-bold">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Motivo da
                Reprovação:
              </h6>
              <p id="texto-justificativa" class="mb-0"></p>
            </div>

            <form class="row g-3" id="form-vaga">
              <div class="col-md-8">
                <label class="form-label fw-medium text-secondary"
                  >Título da Vaga *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="titulo_vaga"
                  placeholder="Ex: Desenvolvedor Front-end Júnior"
                  required
                />
              </div>

              <div class="col-md-4">
                <label class="form-label fw-medium text-secondary"
                  >Área de Atuação (Curso) *</label
                >
                <select class="form-select" id="area_atuacao" required>
                  <option value="" selected disabled>
                    Selecione o curso...
                  </option>
                  <option value="Agronomia">Agronomia</option>
                  <option value="Biomedicina">Biomedicina</option>
                  <option value="Ciências Biológicas - Bacharelado">
                    Ciências Biológicas - Bacharelado
                  </option>
                  <option value="Ciências Biológicas - Licenciatura">
                    Ciências Biológicas - Licenciatura
                  </option>
                  <option value="Ciência da Computação">
                    Ciência da Computação
                  </option>
                  <option value="Direito">Direito</option>
                  <option value="Educação Física - Bacharelado">
                    Educação Física - Bacharelado
                  </option>
                  <option value="Educação Física - Licenciatura">
                    Educação Física - Licenciatura
                  </option>
                  <option value="Enfermagem">Enfermagem</option>
                  <option value="Engenharia Florestal">
                    Engenharia Florestal
                  </option>
                  <option value="Física - Licenciatura">
                    Física - Licenciatura
                  </option>
                  <option value="Fisioterapia">Fisioterapia</option>
                  <option value="Geografia - Bacharelado">
                    Geografia - Bacharelado
                  </option>
                  <option value="Geografia - Licenciatura">
                    Geografia - Licenciatura
                  </option>
                  <option value="História - Licenciatura">
                    História - Licenciatura
                  </option>
                  <option value="Inteligência Artificial">
                    Inteligência Artificial
                  </option>
                  <option value="Letras - Inglês">Letras - Inglês</option>
                  <option value="Letras - Português">Letras - Português</option>
                  <option value="Matemática - Licenciatura">
                    Matemática - Licenciatura
                  </option>
                  <option value="Medicina">Medicina</option>
                  <option value="Medicina Veterinária">
                    Medicina Veterinária
                  </option>
                  <option value="Pedagogia">Pedagogia</option>
                  <option value="Psicologia">Psicologia</option>
                  <option value="Química - Bacharelado">
                    Química - Bacharelado
                  </option>
                  <option value="Química - Licenciatura">
                    Química - Licenciatura
                  </option>
                  <option value="Zootecnia">Zootecnia</option>
                </select>
              </div>

              <div class="col-12">
                <label class="form-label fw-medium text-secondary"
                  >Atribuições e Requisitos *</label
                >
                <textarea
                  class="form-control"
                  id="atribuicoes_requisitos"
                  rows="5"
                  placeholder="Descreva as responsabilidades e os requisitos exigidos para a vaga..."
                  required
                ></textarea>
              </div>

              <div class="col-12">
                <label class="form-label fw-medium text-secondary"
                  >Contato / Link de Inscrição *</label
                >
                <input
                  type="text"
                  class="form-control"
                  id="informacoes_contato"
                  placeholder="Ex: rh@empresa.com.br ou https://gupy.io/..."
                  required
                />
              </div>

              <div
                id="painel-coordenador"
                class="col-12 mt-4 p-4 rounded-3 border"
                style="display: none; background-color: rgba(23, 66, 140, 0.05)"
              >
                <h6
                  class="fw-bold mb-3"
                  style="color: var(--color-azul-riachuelo)"
                >
                  <i class="bi bi-shield-check me-2"></i>Avaliação da
                  Coordenação
                </h6>
                <label class="form-label fw-medium text-secondary"
                  >Justificativa da Avaliação</label
                >
                <textarea
                  class="form-control mb-3"
                  id="justificativa"
                  rows="3"
                  placeholder="Obrigatório preencher em caso de reprovação. Opcional para aprovação."
                ></textarea>

                <div class="d-flex justify-content-end gap-2">
                  <button
                    type="button"
                    class="btn btn-outline-danger px-4 fw-bold"
                    id="btn-reprovar"
                  >
                    Reprovar Vaga
                  </button>
                  <button
                    type="button"
                    class="btn px-4 fw-bold text-white"
                    style="
                      background-color: var(--color-verde-corrego);
                      border: none;
                    "
                    id="btn-aprovar"
                  >
                    Aprovar Vaga
                  </button>
                </div>
              </div>

              <div class="col-12 mt-4 text-end" id="acoes-egresso">
                <button
                  type="submit"
                  class="btn btn-primary px-4 btn-lg"
                  id="btn-salvar"
                >
                  <span
                    class="spinner-border spinner-border-sm d-none"
                    id="spinner-salvar"
                    role="status"
                  ></span>
                  <span id="texto-btn-salvar" class="fw-bold"
                    ><i class="bi bi-send me-2"></i> Enviar para Avaliação</span
                  >
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Alerta -->
    <div class="modal fade" id="modalAlertas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header text-white" id="modal-alerta-header">
            <h5 class="modal-title fw-bold" id="modalAlertasLabel">
              <i class="bi" id="modal-alerta-icon"></i>
              <span id="modal-alerta-titulo">Mensagem</span>
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
              aria-label="Fechar"
            ></button>
          </div>
          <div class="modal-body p-4 text-center">
            <p class="fs-5 mb-0" id="modal-alerta-mensagem"></p>
          </div>
          <div class="modal-footer bg-light border-0 justify-content-center">
            <button
              type="button"
              class="btn btn-secondary px-4 fw-bold"
              data-bs-dismiss="modal"
              id="btn-fechar-modal"
            >
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <script>
      document.addEventListener("DOMContentLoaded", async function () {
        const context = await inicializarPainel("vagas", "..");
        if (!context) return;

        const supabase = context.supabase;
        const session = context.session;
        const perfil = context.perfil;

        if (perfil.foto_perfil) {
          document.getElementById("top-avatar").src = perfil.foto_perfil;
        }

        let modalAlertasInstance = new bootstrap.Modal(
          document.getElementById("modalAlertas"),
        );
        let redirectUrl = null;

        function exibirAlerta(titulo, mensagem, tipo, redUrl = null) {
          const header = document.getElementById("modal-alerta-header");
          const icon = document.getElementById("modal-alerta-icon");
          redirectUrl = redUrl;

          document.getElementById("modal-alerta-titulo").innerText = titulo;
          document.getElementById("modal-alerta-mensagem").innerText = mensagem;

          header.className = "modal-header text-white";
          icon.className = "bi me-2";

          if (tipo === "sucesso") {
            header.style.backgroundColor = "var(--background)";
            icon.classList.add("bi-check-circle-fill");
          } else if (tipo === "erro") {
            header.style.backgroundColor = "#dc3545";
            icon.classList.add("bi-exclamation-triangle-fill");
          } else {
            header.style.backgroundColor = "var(--color-azul-riachuelo)";
            icon.classList.add("bi-info-circle-fill");
          }

          modalAlertasInstance.show();
        }

        document
          .getElementById("modalAlertas")
          .addEventListener("hidden.bs.modal", function () {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            }
          });

        const urlParams = new URLSearchParams(window.location.search);
        const vagaId = urlParams.get("id");

        const form = document.getElementById("form-vaga");
        const btnSalvar = document.getElementById("btn-salvar");
        const spinnerSalvar = document.getElementById("spinner-salvar");
        const textoBtnSalvar = document.getElementById("texto-btn-salvar");

        // VERIFICA SE É EDIÇÃO OU AVALIAÇÃO
        if (vagaId) {
          document.getElementById("titulo-form").innerText =
            "Oportunidade #" + vagaId;
          const { data, error } = await supabase
            .from("vagas")
            .select("*")
            .eq("id", vagaId)
            .single();

          if (error || !data) {
            exibirAlerta(
              "Erro!",
              "Vaga não encontrada!",
              "erro",
              "listar.html",
            );
            return;
          }

          preencherCampos(data);
          configurarVisibilidade(data);
        }

        function preencherCampos(v) {
          document.getElementById("titulo_vaga").value = v.titulo_vaga;
          document.getElementById("area_atuacao").value = v.area_atuacao;
          document.getElementById("atribuicoes_requisitos").value =
            v.atribuicoes_requisitos;
          document.getElementById("informacoes_contato").value =
            v.informacoes_contato;

          if (v.status === "reprovado") {
            document.getElementById("feedback-reprovacao").style.display =
              "block";
            document.getElementById("texto-justificativa").innerText =
              v.justificativa_reprovacao;
          }
        }

        function configurarVisibilidade(v) {
          const souDonoDaVaga = v.usuario_id === session.user.id;
          const souStaff = perfil.nivel_acesso !== "egresso";

          // Se eu for Coordenação/Admin e a vaga NÃO foi criada por mim:
          if (souStaff && !souDonoDaVaga) {
            document.getElementById("painel-coordenador").style.display =
              "block";
            document.getElementById("acoes-egresso").style.display = "none";

            [
              "titulo_vaga",
              "area_atuacao",
              "atribuicoes_requisitos",
              "informacoes_contato",
            ].forEach((id) => {
              document.getElementById(id).disabled = true;
            });
          }
        }

        // ========================================================
        // AÇÃO 1: AVALIAÇÃO DO COORDENADOR (Aprovar/Reprovar)
        // ========================================================
        async function avaliarVaga(novoStatus) {
          const justificativa = document.getElementById("justificativa").value;

          if (novoStatus === "reprovado" && !justificativa.trim()) {
            return exibirAlerta(
              "Justificativa Ausente",
              "A justificativa é obrigatória para reprovar a vaga. Explique ao aluno o que precisa ser corrigido.",
              "aviso",
            );
          }

          const btnAtivo =
            novoStatus === "aprovado"
              ? document.getElementById("btn-aprovar")
              : document.getElementById("btn-reprovar");
          const textoOriginal = btnAtivo.innerText;
          btnAtivo.innerText = "Processando...";
          btnAtivo.disabled = true;

          const { error } = await supabase
            .from("vagas")
            .update({
              status: novoStatus,
              justificativa_reprovacao: justificativa,
              usuario_id_coordenacao: session.user.id,
              data_aprovacao: new Date(),
            })
            .eq("id", vagaId);

          if (!error) {
            exibirAlerta(
              "Sucesso",
              `Vaga ${novoStatus} com sucesso!`,
              "sucesso",
              "listar.html",
            );
          } else {
            exibirAlerta("Erro", "Erro ao avaliar a vaga.", "erro");
            btnAtivo.innerText = textoOriginal;
            btnAtivo.disabled = false;
          }
        }

        document
          .getElementById("btn-aprovar")
          .addEventListener("click", () => avaliarVaga("aprovado"));
        document
          .getElementById("btn-reprovar")
          .addEventListener("click", () => avaliarVaga("reprovado"));

        // ========================================================
        // AÇÃO 2: SUBMISSÃO DO EGRESSO (Cadastrar/Editar)
        // ========================================================
        form.addEventListener("submit", async function (e) {
          e.preventDefault();

          btnSalvar.disabled = true;
          spinnerSalvar.classList.remove("d-none");
          textoBtnSalvar.innerHTML = "Salvando...";

          const payload = {
            titulo_vaga: document.getElementById("titulo_vaga").value,
            area_atuacao: document.getElementById("area_atuacao").value,
            atribuicoes_requisitos: document.getElementById(
              "atribuicoes_requisitos",
            ).value,
            informacoes_contato: document.getElementById("informacoes_contato")
              .value,
            usuario_id: session.user.id,
            status: "pendente",
          };

          const { error } = vagaId
            ? await supabase.from("vagas").update(payload).eq("id", vagaId)
            : await supabase.from("vagas").insert([payload]);

          if (!error) {
            exibirAlerta(
              "Sucesso!",
              "Oportunidade salva com sucesso! Ela passará pela aprovação da coordenação do curso.",
              "sucesso",
              "listar.html",
            );
          } else {
            exibirAlerta(
              "Erro",
              "Ocorreu um erro ao salvar a oportunidade.",
              "erro",
            );
            btnSalvar.disabled = false;
            spinnerSalvar.classList.add("d-none");
            textoBtnSalvar.innerHTML =
              '<i class="bi bi-send me-2"></i> Enviar para Avaliação';
          }
        });
      });
    </script>
  </body>
</html>
