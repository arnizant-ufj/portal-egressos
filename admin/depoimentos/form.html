<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gerenciar Depoimento - Painel UFJ</title>
    <link href="../../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
    <style>
      .star-icon {
        cursor: pointer;
        transition: transform 0.2s;
      }
      .star-icon:hover {
        transform: scale(1.2);
      }
    </style>
  </head>
  <body>
    <div id="loading-screen">
      <div
        class="spinner-border"
        style="color: var(--color-azul-riachuelo)"
        role="status"
      ></div>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4
              class="mb-0 fw-bold"
              style="color: var(--color-azul-riachuelo)"
              id="page-title"
            >
              Depoimentos
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/user.png"
                id="top-avatar"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="mb-3">
            <a
              href="listar.html"
              class="btn btn-outline-secondary btn-sm fw-bold"
              ><i class="bi bi-arrow-left me-1"></i> Voltar</a
            >
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <h5
              class="fw-bold mb-4 border-bottom pb-2"
              style="color: var(--color-azul-riachuelo)"
              id="titulo-form"
            >
              Deixar um Depoimento
            </h5>

            <div
              id="feedback-reprovacao"
              class="alert mb-4 text-white shadow-sm"
              style="display: none; background-color: #dc3545"
            >
              <h6 class="fw-bold">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>Atenção: Seu
                depoimento não foi aprovado.
              </h6>
              <p class="mb-0 small">
                Por favor, ajuste o conteúdo para que possamos publicá-lo no
                portal.
              </p>
            </div>

            <form class="row g-3" id="form-depoimento">
              <div class="col-12">
                <label class="form-label fw-medium d-block text-secondary"
                  >Avaliação (1 a 5 estrelas) *</label
                >
                <div class="fs-2 text-warning" id="star-rating">
                  <i
                    class="bi bi-star-fill star-icon"
                    data-val="1"
                    style="color: var(--color-amarelo-abelha)"
                  ></i>
                  <i
                    class="bi bi-star-fill star-icon"
                    data-val="2"
                    style="color: var(--color-amarelo-abelha)"
                  ></i>
                  <i
                    class="bi bi-star-fill star-icon"
                    data-val="3"
                    style="color: var(--color-amarelo-abelha)"
                  ></i>
                  <i
                    class="bi bi-star-fill star-icon"
                    data-val="4"
                    style="color: var(--color-amarelo-abelha)"
                  ></i>
                  <i
                    class="bi bi-star-fill star-icon"
                    data-val="5"
                    style="color: var(--color-amarelo-abelha)"
                  ></i>
                </div>
                <input type="hidden" id="estrelas" value="5" required />
              </div>

              <div class="col-12">
                <label class="form-label fw-medium text-secondary"
                  >Seu Depoimento *</label
                >
                <textarea
                  class="form-control"
                  id="descricao"
                  rows="4"
                  placeholder="Conte-nos como a universidade ou o portal ajudou na sua jornada..."
                  required
                ></textarea>
              </div>

              <div
                id="painel-coordenador"
                class="col-12 mt-4 p-4 rounded-3 border"
                style="display: none; background-color: rgba(23, 66, 140, 0.05)"
              >
                <h6
                  class="fw-bold mb-3"
                  style="color: var(--color-azul-riachuelo)"
                >
                  Avaliação da Coordenação
                </h6>
                <div class="d-flex justify-content-end gap-2">
                  <button
                    type="button"
                    class="btn btn-outline-danger px-4 fw-bold"
                    id="btn-reprovar"
                  >
                    Reprovar Depoimento
                  </button>
                  <button
                    type="button"
                    class="btn px-4 fw-bold text-white"
                    id="btn-aprovar"
                    style="
                      background-color: var(--color-verde-corrego);
                      border: none;
                    "
                  >
                    Aprovar Depoimento
                  </button>
                </div>
              </div>

              <div class="col-12 mt-4 text-end" id="acoes-egresso">
                <button
                  type="submit"
                  class="btn btn-primary px-4 btn-lg"
                  id="btn-salvar"
                >
                  <span
                    class="spinner-border spinner-border-sm d-none"
                    id="spinner-salvar"
                    role="status"
                  ></span>
                  <span id="texto-btn-salvar" class="fw-bold"
                    ><i class="bi bi-send me-2"></i> Enviar Depoimento</span
                  >
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>
    </div>

    <!-- Modal Alerta -->
    <div class="modal fade" id="modalAlertas" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow">
          <div class="modal-header text-white" id="modal-alerta-header">
            <h5 class="modal-title fw-bold" id="modalAlertasLabel">
              <i class="bi" id="modal-alerta-icon"></i>
              <span id="modal-alerta-titulo">Mensagem</span>
            </h5>
            <button
              type="button"
              class="btn-close btn-close-white"
              data-bs-dismiss="modal"
            ></button>
          </div>
          <div class="modal-body p-4 text-center">
            <p class="fs-5 mb-0" id="modal-alerta-mensagem"></p>
          </div>
          <div class="modal-footer bg-light border-0 justify-content-center">
            <button
              type="button"
              class="btn btn-secondary px-4 fw-bold"
              data-bs-dismiss="modal"
              id="btn-fechar-modal"
            >
              Fechar
            </button>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const context = await inicializarPainel("depoimentos", "..");
        if (!context) return;

        const { supabase, session, perfil } = context;
        if (perfil.foto_perfil)
          document.getElementById("top-avatar").src = perfil.foto_perfil;

        let modalAlertasInstance = new bootstrap.Modal(
          document.getElementById("modalAlertas"),
        );
        let redirectUrl = null;

        function exibirAlerta(titulo, mensagem, tipo, redUrl = null) {
          const header = document.getElementById("modal-alerta-header");
          const icon = document.getElementById("modal-alerta-icon");
          redirectUrl = redUrl;

          document.getElementById("modal-alerta-titulo").innerText = titulo;
          document.getElementById("modal-alerta-mensagem").innerText = mensagem;

          header.className = "modal-header text-white";
          icon.className = "bi me-2";

          if (tipo === "sucesso") {
            header.style.backgroundColor = "var(--color-verde-corrego)";
            icon.classList.add("bi-check-circle-fill");
          } else if (tipo === "erro") {
            header.style.backgroundColor = "#dc3545";
            icon.classList.add("bi-exclamation-triangle-fill");
          } else {
            header.style.backgroundColor = "var(--color-azul-riachuelo)";
            icon.classList.add("bi-info-circle-fill");
          }

          modalAlertasInstance.show();
        }

        document
          .getElementById("modalAlertas")
          .addEventListener("hidden.bs.modal", function () {
            if (redirectUrl) {
              window.location.href = redirectUrl;
            }
          });

        const depId = new URLSearchParams(window.location.search).get("id");
        let notaAtual = 5;

        // Lógica de clicar nas estrelinhas
        const stars = document.querySelectorAll(".star-icon");
        stars.forEach((star) => {
          star.addEventListener("click", function () {
            // Se for coordenador/admin avaliando, não deixa ele mudar as estrelas do aluno
            if (perfil.nivel_acesso !== "egresso" && depId) return;

            notaAtual = this.getAttribute("data-val");
            document.getElementById("estrelas").value = notaAtual;

            stars.forEach((s) => {
              if (s.getAttribute("data-val") <= notaAtual) {
                s.classList.remove("bi-star");
                s.classList.add("bi-star-fill");
              } else {
                s.classList.remove("bi-star-fill");
                s.classList.add("bi-star");
              }
            });
          });
        });

        // Carrega dados se for edição
        if (depId) {
          document.getElementById("titulo-form").innerText =
            "Avaliando Depoimento #" + depId;
          const { data } = await supabase
            .from("depoimentos")
            .select("*")
            .eq("id", depId)
            .single();

          if (data) {
            document.getElementById("descricao").value = data.descricao;
            document
              .querySelector(`.star-icon[data-val="${data.estrelas}"]`)
              .click();

            if (
              data.status === "reprovado" &&
              data.usuario_id === session.user.id
            ) {
              document.getElementById("feedback-reprovacao").style.display =
                "block";
            }

            // Lógica de visibilidade
            if (
              perfil.nivel_acesso !== "egresso" &&
              data.usuario_id !== session.user.id
            ) {
              document.getElementById("painel-coordenador").style.display =
                "block";
              document.getElementById("acoes-egresso").style.display = "none";
              document.getElementById("descricao").disabled = true;
              document.getElementById("star-rating").style.cursor = "default";
            }
          }
        }

        // Ação do Coordenador / Admin
        async function avaliarDepoimento(novoStatus) {
          const btn =
            novoStatus === "aprovado"
              ? document.getElementById("btn-aprovar")
              : document.getElementById("btn-reprovar");
          const originalText = btn.innerText;
          btn.disabled = true;
          btn.innerText = "Processando...";

          const { error } = await supabase
            .from("depoimentos")
            .update({ status: novoStatus })
            .eq("id", depId);

          if (!error) {
            exibirAlerta(
              "Sucesso",
              `Depoimento ${novoStatus} com sucesso!`,
              "sucesso",
              "listar.html",
            );
          } else {
            exibirAlerta(
              "Erro",
              "Não foi possível avaliar o depoimento.",
              "erro",
            );
            btn.disabled = false;
            btn.innerText = originalText;
          }
        }

        document
          .getElementById("btn-aprovar")
          .addEventListener("click", () => avaliarDepoimento("aprovado"));
        document
          .getElementById("btn-reprovar")
          .addEventListener("click", () => avaliarDepoimento("reprovado"));

        // Ação do Egresso (Cadastrar / Editar)
        document
          .getElementById("form-depoimento")
          .addEventListener("submit", async (e) => {
            e.preventDefault();
            const btnSalvar = document.getElementById("btn-salvar");
            btnSalvar.disabled = true;
            document
              .getElementById("spinner-salvar")
              .classList.remove("d-none");

            const payload = {
              descricao: document.getElementById("descricao").value,
              estrelas: document.getElementById("estrelas").value,
              usuario_id: session.user.id,
              status: "pendente", // Volta para pendente após edição
            };

            const { error } = depId
              ? await supabase
                  .from("depoimentos")
                  .update(payload)
                  .eq("id", depId)
              : await supabase.from("depoimentos").insert([payload]);

            if (!error) {
              exibirAlerta(
                "Sucesso",
                "Depoimento salvo! Ele passará por aprovação antes de ser exibido.",
                "sucesso",
                "listar.html",
              );
            } else {
              exibirAlerta("Erro", "Erro ao salvar depoimento.", "erro");
              btnSalvar.disabled = false;
              document.getElementById("spinner-salvar").classList.add("d-none");
            }
          });
      });
    </script>
  </body>
</html>
