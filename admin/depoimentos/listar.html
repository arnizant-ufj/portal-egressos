<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Depoimentos - Painel UFJ</title>
    <link href="../../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>
  <body>
    <div id="loading-screen">
      <div class="spinner-border text-primary" role="status"></div>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4 class="mb-0 text-secondary fw-bold" id="page-title">
              Depoimentos
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/person-m-9.webp"
                id="top-avatar"
                alt="Profile"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0">Gerenciar Depoimentos</h5>
            <a href="form.html" class="btn btn-primary" id="btn-novo">
              <i class="bi bi-plus-lg me-2"></i>Novo Depoimento
            </a>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <ul class="nav nav-tabs mb-4" role="tablist">
              <li class="nav-item">
                <button
                  class="nav-link active"
                  data-bs-toggle="tab"
                  data-bs-target="#meus-depoimentos"
                >
                  Meus Depoimentos
                </button>
              </li>
              <li class="nav-item" id="tab-pendentes-li" style="display: none">
                <button
                  class="nav-link"
                  data-bs-toggle="tab"
                  data-bs-target="#pendentes"
                >
                  Avaliar Depoimentos
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div class="tab-pane fade show active" id="meus-depoimentos">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Trecho</th>
                        <th>Avaliação</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                      </tr>
                    </thead>
                    <tbody id="tbody-meus">
                      <tr>
                        <td colspan="4" class="text-center">Carregando...</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="tab-pane fade" id="pendentes">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Autor</th>
                        <th>Curso</th>
                        <th>Estrelas</th>
                        <th class="text-end">Ações</th>
                      </tr>
                    </thead>
                    <tbody id="tbody-pendentes">
                      <tr>
                        <td colspan="4" class="text-center">Carregando...</td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const context = await inicializarPainel("depoimentos", "..");
        if (!context) return;

        if (context.perfil.foto_perfil)
          document.getElementById("top-avatar").src =
            context.perfil.foto_perfil;

        if (context.perfil.nivel_acesso !== "egresso") {
          document.getElementById("tab-pendentes-li").style.display = "block";
          // Staff geralmente não escreve depoimento, escondemos o botão de Novo
          document.getElementById("btn-novo").style.display = "none";
          carregarPendentes();
        }

        carregarMeusDepoimentos();

        // Função auxiliar para desenhar as estrelinhas
        function renderStars(count) {
          let starsHtml = "";
          for (let i = 0; i < 5; i++) {
            starsHtml +=
              i < count
                ? '<i class="bi bi-star-fill text-warning me-1"></i>'
                : '<i class="bi bi-star text-muted me-1"></i>';
          }
          return starsHtml;
        }

        async function carregarMeusDepoimentos() {
          const { data } = await context.supabase
            .from("depoimentos")
            .select("*")
            .eq("usuario_id", context.session.user.id)
            .order("data_criacao", { ascending: false });

          const tbody = document.getElementById("tbody-meus");
          if (!data || data.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center">Você ainda não deixou um depoimento.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          data.forEach((d) => {
            let badge =
              d.status === "aprovado"
                ? "bg-success"
                : d.status === "reprovado"
                  ? "bg-danger"
                  : "bg-warning text-dark";
            // Pega só os primeiros 40 caracteres pra tabela não ficar gigante
            let resumo =
              d.descricao.length > 40
                ? d.descricao.substring(0, 40) + "..."
                : d.descricao;

            tbody.innerHTML += `
              <tr>
                <td class="text-secondary">"${resumo}"</td>
                <td>${renderStars(d.estrelas)}</td>
                <td><span class="badge ${badge}">${d.status}</span></td>
                <td class="text-end"><a href="form.html?id=${d.id}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i></a></td>
              </tr>
            `;
          });
        }

        async function carregarPendentes() {
          // Puxa o depoimento e os dados de quem escreveu (nome e curso)
          const { data } = await context.supabase
            .from("depoimentos")
            .select("*, perfis(nome, curso)")
            .eq("status", "pendente");

          const tbody = document.getElementById("tbody-pendentes");
          if (!data || data.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center">Nenhum depoimento para avaliar.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          data.forEach((d) => {
            tbody.innerHTML += `
              <tr>
                <td class="fw-bold">${d.perfis?.nome || "Anônimo"}</td>
                <td>${d.perfis?.curso || "Não informado"}</td>
                <td>${renderStars(d.estrelas)}</td>
                <td class="text-end"><a href="form.html?id=${d.id}" class="btn btn-sm btn-primary">Avaliar</a></td>
              </tr>
            `;
          });
        }
      });
    </script>
  </body>
</html>
