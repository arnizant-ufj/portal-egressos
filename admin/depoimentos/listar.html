<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Depoimentos - Painel UFJ</title>
    <link href="../../assets/img/prograd1.ico" rel="icon" />
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link href="https://fonts.gstatic.com" rel="preconnect" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&family=Red+Hat+Text:ital,wght@0,300..700;1,300..700&display=swap"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="../../assets/vendor/bootstrap-icons/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link href="../../assets/css/main.css" rel="stylesheet" />
    <link href="../../assets/css/painel.css" rel="stylesheet" />
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../../js/adminLayout.js"></script>
  </head>
  <body>
    <div id="loading-screen">
      <div
        class="spinner-border"
        style="color: var(--color-azul-riachuelo)"
        role="status"
      ></div>
    </div>

    <div class="container-fluid" id="main-panel" style="display: none">
      <div class="row">
        <div class="col-md-3 col-lg-2 p-0 sidebar position-fixed">
          <div class="sidebar-header">
            <img
              src="../../assets/img/logo_ufj_branca.png"
              alt="Logo UFJ"
              class="img-fluid mb-3"
              style="max-height: 55px"
            />
            <h6 class="mb-0 text-white fw-bold" id="badge-nivel">Painel</h6>
          </div>
          <nav class="nav flex-column flex-grow-1" id="sidebar-menu"></nav>
          <a href="#" class="logout-btn" id="btn-logout"
            ><i class="bi bi-box-arrow-left"></i> Sair</a
          >
        </div>

        <div class="col-md-9 offset-md-3 col-lg-10 offset-lg-2 content-area">
          <div
            class="d-flex justify-content-between align-items-center mb-5 bg-white p-4 shadow-sm rounded-3 border-0"
          >
            <h4
              class="mb-0 fw-bold"
              style="color: var(--color-azul-riachuelo)"
              id="page-title"
            >
              Depoimentos
            </h4>
            <div class="d-flex align-items-center">
              <span class="me-3 fw-medium text-secondary" id="user-name"
                >...</span
              >
              <img
                src="../../assets/img/person/user.png"
                id="top-avatar"
                class="rounded-circle shadow-sm bg-light"
                style="width: 45px; height: 45px; object-fit: cover"
              />
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-4">
            <h5 class="fw-bold mb-0 text-secondary">Gerenciar Depoimentos</h5>
            <a
              href="form.html"
              class="btn btn-primary shadow-sm fw-bold"
              id="btn-novo"
            >
              <i class="bi bi-plus-lg me-2"></i>Novo Depoimento
            </a>
          </div>

          <div class="card p-4 shadow-sm border-0 rounded-4">
            <ul class="nav nav-tabs mb-4" role="tablist">
              <li class="nav-item" id="tab-meus-li">
                <button
                  class="nav-link active"
                  data-bs-toggle="tab"
                  data-bs-target="#meus-depoimentos"
                >
                  Meus Depoimentos
                </button>
              </li>
              <li class="nav-item" id="tab-pendentes-li" style="display: none">
                <button
                  class="nav-link"
                  data-bs-toggle="tab"
                  data-bs-target="#pendentes"
                >
                  Avaliar Depoimentos
                </button>
              </li>
            </ul>

            <div class="tab-content">
              <div class="tab-pane fade show active" id="meus-depoimentos">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Trecho</th>
                        <th>Avaliação</th>
                        <th>Status</th>
                        <th class="text-end">Ações</th>
                      </tr>
                    </thead>
                    <tbody id="tbody-meus">
                      <tr>
                        <td colspan="4" class="text-center py-4 text-muted">
                          Carregando...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>

              <div class="tab-pane fade" id="pendentes">
                <div class="table-responsive">
                  <table class="table table-hover align-middle">
                    <thead class="table-light">
                      <tr>
                        <th>Autor</th>
                        <th>Curso</th>
                        <th>Estrelas</th>
                        <th class="text-end">Ações</th>
                      </tr>
                    </thead>
                    <tbody id="tbody-pendentes">
                      <tr>
                        <td colspan="4" class="text-center py-4 text-muted">
                          Carregando...
                        </td>
                      </tr>
                    </tbody>
                  </table>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="../../assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", async () => {
        const context = await inicializarPainel("depoimentos", "..");
        if (!context) return;

        if (context.perfil.foto_perfil)
          document.getElementById("top-avatar").src =
            context.perfil.foto_perfil;

        // Oculta "Meus depoimentos" e exibe apenas "Avaliar" para Staff
        if (context.perfil.nivel_acesso !== "egresso") {
          document.getElementById("tab-meus-li").style.display = "none";
          document.getElementById("tab-pendentes-li").style.display = "block";
          document.getElementById("btn-novo").style.display = "none";

          // Força a aba pendentes a ficar ativa
          document
            .querySelector('[data-bs-target="#meus-depoimentos"]')
            .classList.remove("active");
          document
            .querySelector('[data-bs-target="#pendentes"]')
            .classList.add("active");
          document
            .getElementById("meus-depoimentos")
            .classList.remove("show", "active");
          document.getElementById("pendentes").classList.add("show", "active");

          carregarPendentes(context.perfil);
        } else {
          carregarMeusDepoimentos();
        }

        function renderStars(count) {
          let starsHtml = "";
          for (let i = 0; i < 5; i++) {
            starsHtml +=
              i < count
                ? `<i class="bi bi-star-fill me-1" style="color: var(--color-amarelo-abelha);"></i>`
                : `<i class="bi bi-star text-muted me-1"></i>`;
          }
          return starsHtml;
        }

        async function carregarMeusDepoimentos() {
          const { data } = await context.supabase
            .from("depoimentos")
            .select("*")
            .eq("usuario_id", context.session.user.id)
            .order("data_criacao", { ascending: false });

          const tbody = document.getElementById("tbody-meus");
          if (!data || data.length === 0) {
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center text-muted py-4">Você ainda não deixou um depoimento.</td></tr>';
            return;
          }

          tbody.innerHTML = "";
          data.forEach((d) => {
            let bgClass =
              d.status === "aprovado"
                ? "var(--color-verde-corrego)"
                : d.status === "reprovado"
                  ? "#dc3545"
                  : "var(--color-azul-perola)";
            let badge = `<span class="badge" style="background-color: ${bgClass}; font-family: var(--font-red-hat-text);">${d.status}</span>`;

            let resumo =
              d.descricao.length > 40
                ? d.descricao.substring(0, 40) + "..."
                : d.descricao;

            tbody.innerHTML += `
              <tr>
                <td class="text-secondary">"${resumo}"</td>
                <td>${renderStars(d.estrelas)}</td>
                <td>${badge}</td>
                <td class="text-end"><a href="form.html?id=${d.id}" class="btn btn-sm btn-outline-primary" style="border-color: var(--color-azul-riachuelo); color: var(--color-azul-riachuelo);"><i class="bi bi-pencil"></i></a></td>
              </tr>
            `;
          });
        }

        async function carregarPendentes(perfil) {
          const tbody = document.getElementById("tbody-pendentes");

          try {
            // 1. Busca APENAS os depoimentos pendentes (sem forçar relacionamento com banco)
            const { data: depoimentos, error: errorDep } =
              await context.supabase
                .from("depoimentos")
                .select("*")
                .eq("status", "pendente");

            if (errorDep) throw errorDep;

            if (!depoimentos || depoimentos.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="4" class="text-center text-muted py-4">Nenhum depoimento pendente encontrado.</td></tr>';
              return;
            }

            // 2. Extrai os IDs dos usuários que escreveram esses depoimentos
            const usuariosIds = depoimentos.map((d) => d.usuario_id);

            // 3. Busca o nome e curso APENAS desses usuários
            const { data: perfis, error: errorPerf } = await context.supabase
              .from("perfis")
              .select("id, nome, curso_ufj")
              .in("id", usuariosIds);

            if (errorPerf) throw errorPerf;

            // 4. Junta os dados manualmente (JavaScript Merge)
            let dadosCompletos = depoimentos.map((d) => {
              const p = perfis.find((perfil) => perfil.id === d.usuario_id);
              return { ...d, perfis: p };
            });

            // 5. Filtra pelo curso do coordenador logado
            if (perfil.nivel_acesso === "coordenacao") {
              if (!perfil.curso_ufj) {
                console.warn("Coordenador sem curso vinculado.");
                dadosCompletos = [];
              } else {
                const cursoCoordenador = perfil.curso_ufj.trim().toLowerCase();
                dadosCompletos = dadosCompletos.filter(
                  (d) =>
                    d.perfis &&
                    d.perfis.curso_ufj &&
                    d.perfis.curso_ufj.trim().toLowerCase() ===
                      cursoCoordenador,
                );
              }
            }

            // 6. Renderiza na tela
            if (!dadosCompletos || dadosCompletos.length === 0) {
              tbody.innerHTML =
                '<tr><td colspan="4" class="text-center text-muted py-4">Nenhum depoimento pendente para o seu curso.</td></tr>';
              return;
            }

            tbody.innerHTML = "";
            dadosCompletos.forEach((d) => {
              tbody.innerHTML += `
                  <tr>
                    <td class="fw-bold" style="color: var(--text-primary);">${d.perfis?.nome || "Anônimo"}</td>
                    <td class="text-secondary">${d.perfis?.curso_ufj || "Não informado"}</td>
                    <td>${renderStars(d.estrelas)}</td>
                    <td class="text-end"><a href="form.html?id=${d.id}" class="btn btn-sm btn-primary fw-bold">Avaliar</a></td>
                  </tr>
                `;
            });
          } catch (err) {
            console.error("Erro ao carregar pendentes:", err);
            tbody.innerHTML =
              '<tr><td colspan="4" class="text-center text-danger py-4">Erro ao buscar dados do servidor. Atualize a página.</td></tr>';
          }
        }
      });
    </script>
  </body>
</html>
